name: Extract TLD Assets for Godot

on:
  workflow_dispatch:

jobs:
  extract_assets:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python & Tools
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          pip install --upgrade gdown requests
          sudo apt-get update
          sudo apt-get install -y p7zip-full tar xz-utils libicu-dev xvfb

      - name: Download Game from Google Drive
        run: |
          echo "جاري تحميل اللعبة من Google Drive..."
          gdown "1OhrVrIuK3UfEW2uLNwIrl60FT7539pER" -O game_archive
          ls -lh game_archive

      - name: Extract Game Archive
        run: |
          echo "جاري فك ضغط ملفات اللعبة..."
          mkdir -p ./GameSource
          7z x game_archive -o./GameSource
          rm -f game_archive

      - name: Setup AssetRipper & Configurations
        run: |
          echo "جاري تنزيل وتجهيز AssetRipper..."
          mkdir -p ./ripper
          wget -q https://github.com/AssetRipper/AssetRipper/releases/latest/download/AssetRipper_linux_x64.tar.xz
          tar -xf AssetRipper_linux_x64.tar.xz -C ./ripper
          chmod -R +x ./ripper

          # إعدادات التصدير بصيغة GLB للحفاظ على الشجرة لـ Godot
          cat <<EOF > ./AssetRipper.Settings.json
          {
            "MeshExportFormat": "Glb",
            "ImageExportFormat": "Png",
            "AudioExportFormat": "Default",
            "ScriptContentLevel": "Level2"
          }
          EOF
          cp ./AssetRipper.Settings.json ./ripper/AssetRipper.Settings.json

      - name: Run Extraction with Real-Time Monitoring
        run: |
          xvfb-run --auto-servernum python - << 'EOF'
          import os
          import sys
          import time
          import re
          import threading
          import subprocess
          import requests

          # 1. البحث عن الملف التنفيذي
          ripper_bin = None
          for root, dirs, files in os.walk("./ripper"):
              for f in files:
                  if "AssetRipper" in f and not f.endswith(('.json', '.dll', '.so', '.pdb')):
                      ripper_bin = os.path.join(root, f)
                      break

          if not ripper_bin:
              print("لم يتم العثور على ملف AssetRipper التنفيذي!")
              sys.exit(1)

          print(f"الأداة المستخدمة: {ripper_bin}")
          os.chmod(ripper_bin, 0o755)

          # 2. تشغيل السيرفر وقراءة مخرجاته لحظياً
          env = os.environ.copy()
          env["ASPNETCORE_URLS"] = "http://127.0.0.1:0" # جعل النظام يعين بورت متاح

          proc = subprocess.Popen(
              [ripper_bin, "--headless"],
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
              text=True,
              env=env,
              bufsize=1
          )

          server_url = None

          def monitor_logs():
              global server_url
              for line in proc.stdout:
                  clean = line.strip()
                  print(f"[AssetRipper] {clean}", flush=True)
                  match = re.search(r"Now listening on:\s*(http://[^\s]+)", clean)
                  if match and not server_url:
                      server_url = match.group(1).strip()

          thread = threading.Thread(target=monitor_logs, daemon=True)
          thread.start()

          print("في انتظار بدء السيرفر والتقاط البورت...")
          for _ in range(60):
              if server_url:
                  break
              if proc.poll() is not None:
                  print(f"توقف البرنامج فجأة برمز خروج: {proc.returncode}")
                  sys.exit(1)
              time.sleep(1)

          if not server_url:
              print("لم يتم التقاط عنوان السيرفر في الوقت المحدد!")
              proc.terminate()
              sys.exit(1)

          print(f"--> تم الاتصال بنجاح بسيرفر AssetRipper على: {server_url}")

          # 3. تحديد المسار الفعلي لبيانات اللعبة
          game_dir = os.path.abspath("./GameSource")
          for root, dirs, files in os.walk("./GameSource"):
              if any(d.endswith("_Data") for d in dirs) or any(f.endswith(".exe") for f in files):
                  game_dir = os.path.abspath(root)
                  break

          print(f"مسار اللعبة المكتشف: {game_dir}")

          # 4. جلب نقاط الاتصال المتاحة (Endpoints)
          endpoints = []
          for sw_url in [f"{server_url}/swagger/v1/swagger.json", f"{server_url}/openapi/v1.json"]:
              try:
                  sw = requests.get(sw_url, timeout=5).json()
                  endpoints = list(sw.get("paths", {}).keys())
                  print(f"الـ Endpoints المتاحة بالسيرفر: {endpoints}")
                  break
              except Exception:
                  pass

          # 5. إرسال أمر التحميل (Load)
          load_ep = next((e for e in endpoints if "load" in e.lower()), "/LoadFolder")
          print(f"جاري إرسال أمر تحميل مجلد اللعبة عبر {load_ep}...")
          try:
              r_load = requests.post(f"{server_url}{load_ep}", data={"path": game_dir}, timeout=600)
              if r_load.status_code >= 400:
                  r_load = requests.post(f"{server_url}{load_ep}", json={"path": game_dir}, timeout=600)
              print(f"نتيجة أمر التحميل: {r_load.status_code}")
          except Exception as e:
              print(f"خطأ أثناء التحميل: {e}")

          # 6. إرسال أمر التصدير (Export)
          out_dir = os.path.abspath("./ExtractedOutput")
          os.makedirs(out_dir, exist_ok=True)

          export_ep = None
          for candidate in ["ExportAllGroupedByAssetType", "ExportPrimaryContent", "ExportUnityProject", "ExportProject"]:
              found = next((e for e in endpoints if candidate.lower() in e.lower()), None)
              if found:
                  export_ep = found
                  break

          if not export_ep:
              export_ep = "/Export/ExportUnityProject"

          print(f"جاري إرسال أمر التصدير عبر {export_ep} إلى {out_dir}...")
          try:
              r_exp = requests.post(f"{server_url}{export_ep}", data={"path": out_dir}, timeout=1200)
              if r_exp.status_code >= 400:
                  r_exp = requests.post(f"{server_url}{export_ep}", json={"path": out_dir}, timeout=1200)
              print(f"نتيجة أمر التصدير: {r_exp.status_code}")
          except Exception as e:
              print(f"خطأ أثناء التصدير: {e}")

          time.sleep(5)
          proc.terminate()
          print("اكتملت جميع العمليات بنجاح!")
          EOF

      - name: Compress Godot Assets
        run: |
          echo "جاري تجميع الملفات الخاصة بـ Godot..."
          mkdir -p ./Godot_Ready_Assets
          
          # جمع ملفات GLB والصور والمؤثرات الصوتية والسكربتات
          find ./ExtractedOutput -type f \( -name "*.glb" -o -name "*.png" -o -name "*.ogg" -o -name "*.wav" -o -name "*.cs" \) -exec cp --parents {} ./Godot_Ready_Assets/ \;
          
          cd ./Godot_Ready_Assets
          zip -r -9 /tmp/The_Long_Street_Assets.zip .

      - name: Upload Extracted Assets
        uses: actions/upload-artifact@v4
        with:
          name: The_Long_Street_Assets
          path: /tmp/The_Long_Street_Assets.zip
          retention-days: 3
