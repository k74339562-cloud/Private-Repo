name: Extract TLD Assets for Godot

on:
  workflow_dispatch:

jobs:
  extract_assets:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python & Tools
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          pip install --upgrade gdown requests
          sudo apt-get update
          sudo apt-get install -y p7zip-full tar xz-utils libicu-dev xvfb

      - name: Download Game from Google Drive
        run: |
          echo "جاري تحميل اللعبة من Google Drive..."
          gdown "1OhrVrIuK3UfEW2uLNwIrl60FT7539pER" -O game_archive
          ls -lh game_archive

      - name: Extract Game Archive
        run: |
          echo "جاري فك ضغط ملفات اللعبة..."
          mkdir -p ./GameSource
          7z x game_archive -o./GameSource
          rm -f game_archive

      - name: Setup AssetRipper & Configurations
        run: |
          echo "جاري تنزيل وتجهيز AssetRipper..."
          mkdir -p ./ripper
          wget -q https://github.com/AssetRipper/AssetRipper/releases/latest/download/AssetRipper_linux_x64.tar.xz
          tar -xf AssetRipper_linux_x64.tar.xz -C ./ripper
          chmod -R +x ./ripper

          # إعدادات التصدير بصيغة GLB للحفاظ على شجرة المجسمات
          cat <<EOF > ./ripper/AssetRipper.Settings.json
          {
            "MeshExportFormat": "Glb",
            "ImageExportFormat": "Png",
            "AudioExportFormat": "Default",
            "ScriptContentLevel": "Level2"
          }
          EOF

      - name: Run Extraction with Fixed Working Directory
        run: |
          xvfb-run --auto-servernum python - << 'EOF'
          import os
          import sys
          import time
          import socket
          import threading
          import subprocess
          import requests

          # دالة لاختيار بورت محلي حر ومفتوح
          def get_free_port():
              with socket.socket(socket.AF_INET, socket.SOCK_STREAM) as s:
                  s.bind(('127.0.0.1', 0))
                  return s.getsockname()[1]

          port = get_free_port()
          print(f"تم حجز المنفذ المحلي: {port}")

          # البحث عن مسار الأداة التنفيذي
          ripper_bin = None
          for root, dirs, files in os.walk("./ripper"):
              for f in files:
                  if "AssetRipper" in f and not f.endswith(('.json', '.dll', '.so', '.pdb')):
                      ripper_bin = os.path.abspath(os.path.join(root, f))
                      break

          if not ripper_bin:
              print("لم يتم العثور على أداة AssetRipper!")
              sys.exit(1)

          ripper_dir = os.path.dirname(ripper_bin)
          print(f"مسار الأداة: {ripper_bin}")
          print(f"مجلد العمل الخاص بالأداة (cwd): {ripper_dir}")

          # تشغيل الخادم مع ضبط cwd على مجلد الأداة نفسه (هذا يحل خطأ NullReference تماماً)
          proc = subprocess.Popen(
              [ripper_bin, "--headless", "--port", str(port)],
              cwd=ripper_dir,
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
              text=True,
              bufsize=1
          )

          server_url = f"http://127.0.0.1:{port}"

          # طباعة مخرجات السيرفر لحظياً
          def stream_logs():
              for line in proc.stdout:
                  print(f"[AssetRipper] {line.strip()}", flush=True)

          threading.Thread(target=stream_logs, daemon=True).start()

          # انتظار بدء السيرفر
          print(f"في انتظار استجابة السيرفر على {server_url} ...")
          ready = False
          for _ in range(60):
              try:
                  res = requests.get(server_url, timeout=2)
                  if res.status_code < 400:
                      ready = True
                      print("--> سيرفر AssetRipper جاهز بنجاح تام!")
                      break
              except Exception:
                  pass
              if proc.poll() is not None:
                  print(f"توقف السيرفر بكود: {proc.returncode}")
                  sys.exit(1)
              time.sleep(1)

          if not ready:
              print("انتهت مهلة انتظار السيرفر!")
              proc.terminate()
              sys.exit(1)

          # تحديد مسار ملفات اللعبة
          game_dir = os.path.abspath("./GameSource")
          for root, dirs, files in os.walk("./GameSource"):
              if any(d.endswith("_Data") for d in dirs) or any(f.endswith(".exe") for f in files):
                  game_dir = os.path.abspath(root)
                  break

          print(f"المسار الفعلي المكتشف للعبة: {game_dir}")

          # إرسال أمر LoadFolder لتحليل اللعبة
          print("جاري تحميل وقراءة ملفات اللعبة في الذاكرة...")
          r_load = requests.post(f"{server_url}/LoadFolder", data={"path": game_dir}, timeout=1200)
          print(f"حالة أمر التحميل: {r_load.status_code}")

          # إرسال أمر Export وتصدير المجسمات بهيئة GLB
          out_dir = os.path.abspath("./ExtractedOutput")
          os.makedirs(out_dir, exist_ok=True)
          print(f"جاري تصدير المجسمات والمشروع إلى: {out_dir} ...")

          r_exp = requests.post(f"{server_url}/Export/ExportUnityProject", data={"path": out_dir}, timeout=1800)
          if r_exp.status_code >= 400:
              r_exp = requests.post(f"{server_url}/Export/PrimaryContent", data={"path": out_dir}, timeout=1800)

          print(f"حالة أمر التصدير: {r_exp.status_code}")

          time.sleep(5)
          proc.terminate()
          print("اكتملت جميع العمليات بنجاح!")
          EOF

      - name: Compress Godot Assets
        run: |
          echo "جاري تجميع الملفات الخاصة بـ Godot..."
          mkdir -p ./Godot_Ready_Assets
          
          # جمع ملفات GLB والصور والمؤثرات الصوتية والسكربتات
          find ./ExtractedOutput -type f \( -name "*.glb" -o -name "*.png" -o -name "*.ogg" -o -name "*.wav" -o -name "*.cs" \) -exec cp --parents {} ./Godot_Ready_Assets/ \;
          
          cd ./Godot_Ready_Assets
          zip -r -9 /tmp/The_Long_Street_Assets.zip .

      - name: Upload Extracted Assets
        uses: actions/upload-artifact@v4
        with:
          name: The_Long_Street_Assets
          path: /tmp/The_Long_Street_Assets.zip
          retention-days: 3
