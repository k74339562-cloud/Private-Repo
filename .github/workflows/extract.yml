name: Extract TLD Assets for Godot (Windows Native)

on:
  workflow_dispatch:

jobs:
  extract_assets:
    runs-on: windows-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          pip install --upgrade gdown requests

      - name: Download Game from Google Drive
        run: |
          Write-Host "Downloading game files from Google Drive..."
          gdown "1OhrVrIuK3UfEW2uLNwIrl60FT7539pER" -O game_archive.zip
        shell: pwsh

      - name: Extract Game Archive
        run: |
          Write-Host "Extracting game archive..."
          7z x game_archive.zip -o"GameSource"
          Remove-Item -Force game_archive.zip
        shell: pwsh

      - name: Setup AssetRipper for Windows
        run: |
          Write-Host "Downloading AssetRipper for Windows..."
          Invoke-WebRequest -Uri "https://github.com/AssetRipper/AssetRipper/releases/download/1.3.14/AssetRipper_win_x64.zip" -OutFile "ripper.zip"
          7z x ripper.zip -o"ripper"
          Remove-Item -Force ripper.zip

          # Settings for Godot GLB extraction
          $settings = @'
          {
            "MeshExportFormat": "Glb",
            "ImageExportFormat": "Png",
            "AudioExportFormat": "Default",
            "ScriptContentLevel": "Level2"
          }
          '@
          Set-Content -Path "ripper\AssetRipper.Settings.json" -Value $settings
        shell: pwsh

      - name: Run Windows Native Extraction
        env:
          PYTHONIOENCODING: "utf-8"
          PYTHONUTF8: "1"
        run: |
          @'
          import os
          import sys
          import time
          import socket
          import threading
          import subprocess
          import requests

          def get_free_port():
              with socket.socket(socket.AF_INET, socket.SOCK_STREAM) as s:
                  s.bind(('127.0.0.1', 0))
                  return s.getsockname()[1]

          port = get_free_port()
          print(f"[Extractor] Reserved local port: {port}")

          # Find game directory
          game_dir = os.path.abspath("GameSource")
          for root, dirs, files in os.walk("GameSource"):
              if any(d.endswith("_Data") for d in dirs) or any(f.endswith(".exe") for f in files):
                  game_dir = os.path.abspath(root)
                  break
          print(f"[Extractor] Game directory detected: {game_dir}")

          # Find AssetRipper executable
          ripper_bin = os.path.abspath(os.path.join("ripper", "AssetRipper.GUI.Free.exe"))
          if not os.path.exists(ripper_bin):
              for root, dirs, files in os.walk("ripper"):
                  for f in files:
                      if "AssetRipper" in f and f.endswith(".exe"):
                          ripper_bin = os.path.abspath(os.path.join(root, f))
                          break

          ripper_dir = os.path.dirname(ripper_bin)
          print(f"[Extractor] AssetRipper binary: {ripper_bin}")

          cmd = [ripper_bin, "--headless", "--port", str(port)]
          print(f"[Extractor] Launching: {' '.join(cmd)}")

          proc = subprocess.Popen(
              cmd,
              cwd=ripper_dir,
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
              text=True,
              encoding="utf-8",
              errors="replace",
              bufsize=1
          )

          server_url = f"http://127.0.0.1:{port}"

          def stream_logs():
              for line in proc.stdout:
                  print(f"[AssetRipper] {line.strip()}", flush=True)

          threading.Thread(target=stream_logs, daemon=True).start()

          print(f"[Extractor] Waiting for AssetRipper at {server_url} ...")
          ready = False
          for _ in range(60):
              try:
                  res = requests.get(server_url, timeout=2)
                  if res.status_code < 400:
                      ready = True
                      print("[Extractor] AssetRipper server is UP and RUNNING!")
                      break
              except Exception:
                  pass
              if proc.poll() is not None:
                  print(f"[Extractor] Process exited with code: {proc.returncode}")
                  sys.exit(1)
              time.sleep(1)

          if not ready:
              print("[Extractor] Timed out waiting for server!")
              proc.terminate()
              sys.exit(1)

          # 1. Send LoadFolder command
          print(f"[Extractor] Sending LoadFolder command for: {game_dir} ...")
          try:
              r_load = requests.post(f"{server_url}/LoadFolder", data={"path": game_dir}, timeout=1200, allow_redirects=True)
              print(f"[Extractor] LoadFolder response status: {r_load.status_code}")
          except Exception as e:
              print(f"[Extractor] Error during LoadFolder: {e}")

          # 2. Send Export command
          out_dir = os.path.abspath("ExtractedOutput")
          os.makedirs(out_dir, exist_ok=True)
          print(f"[Extractor] Exporting GLB models to: {out_dir} ...")

          export_endpoints = ["/Export/ExportUnityProject", "/Export/PrimaryContent", "/ExportUnityProject"]
          for ep in export_endpoints:
              try:
                  print(f"[Extractor] Trying export endpoint: {ep} ...")
                  r_exp = requests.post(f"{server_url}{ep}", data={"path": out_dir}, timeout=1800, allow_redirects=True)
                  if r_exp.status_code < 400:
                      print(f"[Extractor] Export SUCCESS on {ep} (Code: {r_exp.status_code})")
                      break
                  else:
                      print(f"[Extractor] Response from {ep}: {r_exp.status_code}")
              except Exception as e:
                  print(f"[Extractor] Error on {ep}: {e}")

          time.sleep(5)
          proc.terminate()
          print("[Extractor] All tasks completed successfully!")
          '@ | Out-File -Encoding utf8 -FilePath "run_extract.py"

          python run_extract.py
        shell: pwsh

      - name: Compress Godot Assets
        run: |
          Write-Host "Packaging Godot Assets into ZIP..."
          New-Item -ItemType Directory -Force -Path "Godot_Ready_Assets"
          
          # جمع ملفات GLB والصور والأصوات والسكربتات
          Get-ChildItem -Path "ExtractedOutput" -Recurse -Include *.glb, *.png, *.ogg, *.wav, *.cs | ForEach-Object {
              $dest = Join-Path "Godot_Ready_Assets" $_.Name
              Copy-Item -Path $_.FullName -Destination $dest -Force
          }

          7z a -tzip "The_Long_Street_Assets.zip" ".\Godot_Ready_Assets\*"
        shell: pwsh

      - name: Upload Extracted Assets
        uses: actions/upload-artifact@v4
        with:
          name: The_Long_Street_Assets
          path: The_Long_Street_Assets.zip
          retention-days: 3
