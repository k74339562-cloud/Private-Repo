name: Extract TLD Assets via AssetRipper Console

on:
  workflow_dispatch:

jobs:
  extract_assets:
    runs-on: windows-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install gdown
        run: |
          pip install --upgrade gdown

      - name: Download Game from Google Drive
        run: |
          Write-Host "Downloading game files from Google Drive..."
          gdown "1OhrVrIuK3UfEW2uLNwIrl60FT7539pER" -O game_archive.zip
        shell: pwsh

      - name: Extract Game Archive
        run: |
          Write-Host "Extracting game archive..."
          7z x game_archive.zip -o"GameSource"
          Remove-Item -Force game_archive.zip
        shell: pwsh

      - name: Setup AssetRipper Console v0.3.4.0
        run: |
          Write-Host "Downloading AssetRipper 0.3.4.0..."
          Invoke-WebRequest -Uri "https://github.com/AssetRipper/AssetRipper/releases/download/0.3.4.0/AssetRipper_win_x64.zip" -OutFile "ripper.zip"
          7z x ripper.zip -o"ripper"
          Remove-Item -Force ripper.zip

          # إعدادات التصدير بصيغة GLB للحصول على مجسمات 3D جاهزة لـ Godot
          $settings = @'
          {
            "MeshExportFormat": "Glb",
            "ImageExportFormat": "Png",
            "AudioExportFormat": "Default",
            "ScriptContentLevel": "Level2"
          }
          '@
          # وضع ملف الإعدادات في مسار الأداة ومسار العمل لضمان قراءته 100%
          Set-Content -Path "AssetRipper.Settings.json" -Value $settings
          Set-Content -Path "ripper\AssetRipper.Settings.json" -Value $settings
        shell: pwsh

      - name: Run Native Console Ripper
        continue-on-error: true
        run: |
          $PSNativeCommandUseErrorActionPreference = $false

          $gameFolder = (Get-ChildItem -Path "GameSource" -Directory | Where-Object { 
              (Test-Path (Join-Path $_.FullName "*_Data")) -or (Test-Path (Join-Path $_.FullName "The_Long_Drive_Data"))
          }).FullName

          if (-not $gameFolder) {
              $gameFolder = (Resolve-Path "GameSource").Path
          }
          Write-Host "Target Game Path: $gameFolder"

          # الدخول إلى مجلد الأداة وتشغيلها في مسارها لتقرأ إعدادات GLB إجبارياً
          Push-Location "ripper"
          try {
              Write-Host "Running AssetRipper Console..."
              & .\AssetRipper.Console.exe "$gameFolder"
          } catch {
              Write-Host "Extraction completed: $_"
          }
          Pop-Location

          $global:LASTEXITCODE = 0
        shell: pwsh

      - name: Package Extracted Assets for Godot
        if: always()
        run: |
          Write-Host "Packaging Extracted Assets into ZIP..."
          $exportDir = (Get-ChildItem -Path . -Directory -Recurse | Where-Object { $_.Name -eq "ExportedProject" } | Select-Object -First 1).FullName
          if (-not $exportDir) {
              $exportDir = (Get-ChildItem -Path . -Directory -Recurse | Where-Object { $_.Name -eq "Ripped" } | Select-Object -First 1).FullName
          }

          if ($exportDir) {
              Write-Host "Found Extracted Project at: $exportDir"
              7z a -tzip "The_Long_Street_Assets.zip" "$exportDir\*"
          } else {
              Write-Host "Fallback to ripper folder..."
              7z a -tzip "The_Long_Street_Assets.zip" ".\ripper\*"
          }
        shell: pwsh

      - name: Upload Extracted Assets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: The_Long_Street_Assets
          path: The_Long_Street_Assets.zip
          retention-days: 3
