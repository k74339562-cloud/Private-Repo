name: Extract TLD Assets for Godot

on:
  workflow_dispatch:

jobs:
  extract_assets:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python & Tools
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install --upgrade gdown requests
          sudo apt-get update && sudo apt-get install -y p7zip-full tar xz-utils libicu-dev

      - name: Download Game from Google Drive
        run: |
          echo "جاري تحميل اللعبة من Google Drive..."
          gdown "1OhrVrIuK3UfEW2uLNwIrl60FT7539pER" -O game_archive
          ls -lh game_archive

      - name: Extract Game Archive
        run: |
          echo "جاري فك ضغط ملفات اللعبة..."
          mkdir -p ./GameSource
          7z x game_archive -o./GameSource
          rm -f game_archive

      - name: Setup AssetRipper
        run: |
          echo "جاري تنزيل وتجهيز AssetRipper..."
          mkdir -p ./ripper
          wget -q https://github.com/AssetRipper/AssetRipper/releases/latest/download/AssetRipper_linux_x64.tar.xz
          tar -xf AssetRipper_linux_x64.tar.xz -C ./ripper
          chmod -R +x ./ripper

          # إعدادات التصدير بصيغة GLB
          cat <<EOF > ./ripper/AssetRipper.Settings.json
          {
            "MeshExportFormat": "Glb",
            "ImageExportFormat": "Png",
            "AudioExportFormat": "Default",
            "ScriptContentLevel": "Level2"
          }
          EOF

      - name: Run Extraction via Python Orchestrator
        run: |
          python - << 'EOF'
          import os
          import sys
          import time
          import glob
          import subprocess
          import requests

          # 1. البحث عن الملف التنفيذي لـ AssetRipper
          ripper_bin = None
          for root, dirs, files in os.walk("./ripper"):
              for f in files:
                  if "AssetRipper" in f and not f.endswith(('.json', '.dll', '.so', '.pdb')):
                      ripper_bin = os.path.join(root, f)
                      break

          if not ripper_bin:
              print("لم يتم العثور على ملف AssetRipper التنفيذي!")
              sys.exit(1)

          print(f"تم العثور على الأداة: {ripper_bin}")
          os.chmod(ripper_bin, 0o755)

          # 2. تشغيل السيرفر في وضع Headless
          port = 5055
          proc = subprocess.Popen([ripper_bin, "--headless", "--port", str(port)], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)

          base_url = f"http://127.0.0.1:{port}"
          print("في انتظار استجابة السيرفر...")
          ready = False
          for _ in range(40):
              try:
                  res = requests.get(base_url, timeout=2)
                  if res.status_code < 400:
                      ready = True
                      print("سيرفر AssetRipper جاهز ويعمل بنجاح!")
                      break
              except Exception:
                  time.sleep(1)

          if not ready:
              print("فشل الاتصال بسيرفر AssetRipper.")
              proc.terminate()
              sys.exit(1)

          # 3. تحديد مجلد بيانات اللعبة بدقة
          game_dir = os.path.abspath("./GameSource")
          for root, dirs, files in os.walk("./GameSource"):
              if any(d.endswith("_Data") for d in dirs) or any(f.endswith(".exe") for f in files):
                  game_dir = os.path.abspath(root)
                  break

          print(f"المسار الفعلي للعبة: {game_dir}")

          # 4. إرسال أمر تحميل اللعبة
          print("جاري قراءة وتحليل ملفات اللعبة (قد يستغرق دقيقة)...")
          try:
              r_load = requests.post(f"{base_url}/LoadFolder", data={"path": game_dir}, timeout=300)
              print(f"حالة التحميل: {r_load.status_code}")
          except Exception as e:
              print(f"خطأ أثناء التحميل: {e}")

          # 5. إرسال أمر التصدير
          out_dir = os.path.abspath("./ExtractedOutput")
          os.makedirs(out_dir, exist_ok=True)
          print(f"جاري تصدير المجسمات بهيئة GLB إلى: {out_dir}")
          
          try:
              # محاولة تصدير المشروع الكامل أو المحتوى الأساسي
              r_exp = requests.post(f"{base_url}/Export/ExportUnityProject", data={"path": out_dir}, timeout=600)
              if r_exp.status_code >= 400:
                  r_exp = requests.post(f"{base_url}/Export/PrimaryContent", data={"path": out_dir}, timeout=600)
              print(f"حالة التصدير: {r_exp.status_code}")
          except Exception as e:
              print(f"خطأ أثناء التصدير: {e}")

          proc.terminate()
          print("تمت عملية الاستخراج بنجاح!")
          EOF

      - name: Compress Godot Assets
        run: |
          echo "جاري فحص وتجميع أصول Godot..."
          mkdir -p ./Godot_Ready_Assets
          
          # جمع ملفات GLB والصور والأصوات وكود C#
          find ./ExtractedOutput -type f \( -name "*.glb" -o -name "*.png" -o -name "*.ogg" -o -name "*.wav" -o -name "*.cs" \) -exec cp --parents {} ./Godot_Ready_Assets/ \;
          
          cd ./Godot_Ready_Assets
          zip -r -9 /tmp/The_Long_Street_Assets.zip .

      - name: Upload Extracted Assets
        uses: actions/upload-artifact@v4
        with:
          name: The_Long_Street_Assets
          path: /tmp/The_Long_Street_Assets.zip
          retention-days: 3
